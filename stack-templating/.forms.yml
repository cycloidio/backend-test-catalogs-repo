---
version: 2
use_cases:
  - name: template-files
  - name: template-dir
  - name: cycloid-common
    sections:
      - name: Template variables
        groups:
          - name: nginx
            technologies: [custom]
            vars:
              - name: Features
                key: features
                type: array
                widget: auto_complete
                widget_config:
                  multiselect: true
                values: ["http-proxy", "load-balancer"]
                default: ["http-proxy", "load-balancer"]

              - name: Image tag
                key: nginx.image_tag
                type: string
                widget: simple_text
                required: true

              - name: Container port
                key: nginx.container_port
                type: integer
                widget: number
                default: 80

              - name: Number of replicas
                key: replicas_num
                type: integer
                widget: number
                default: 2
