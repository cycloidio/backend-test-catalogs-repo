version: 4
name: ValuesRefAuthV4
canonical: valuesrefauthv4
author: 'lukasz_opasiak_cycloid'
# Stack used by the e2e suite to exercise values_ref_config authentication on
# stackforms values_ref calls (PROD-817). Keep it minimal: one plain widget and
# one values_ref widget carrying a values_ref_config auth block.
description: 'Exercises values_ref_config authentication for values_ref calls.'
image: https://github.com/cycloidio/bootstrap-stacks/blob/master/blank-sample/thumbnail.png
template: false
status: 'public'
config:
  default:
    name: 'Default'
    pipeline:
      pipeline:
        path: 'pipeline/pipeline.yml'
      variables:
        path: 'pipeline/variables.sample.yml'
        destination: '($ .project $)/pipeline/($ .environment $)/variables-($ .component $).yml'
