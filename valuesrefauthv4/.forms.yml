# Exercises values_ref_config authentication on values_ref calls (PROD-817).
# See: https://docs.staging.cycloid.io/deploy/stackforms/file-format.html
use_cases:
- name: default
  sections:
  - name: Authentication
    groups:
    - name: Options
      technologies: [pipeline]
      vars:
      - name: "Message"
        description: "A message echoed during pipeline runs."
        key: message
        type: string
        widget: simple_text
        default: "hello world"
      - name: "Region (authenticated value_ref)"
        description: "Options fetched from a value_ref carrying a
          values_ref_config auth block (PROD-817): a bearer token given as a
          ${cred:...} reference resolved server-side, plus a static header and a
          timeout. The header is applied to the request; the minio fixture is
          served anonymously so it is ignored here (region_authed gates on it)."
        key: region
        type: string
        widget: dropdown
        values_ref: http://minio:9000/valuesref/values_ref_auth.json
        values_ref_config:
          timeout: "30s"
          headers:
            X-Cy-Test: e2e
          auth:
            type: bearer
            token: "${cred:values-ref-token.token}"
        default: "eu-west-1"
      - name: "Region (auth-gated value_ref)"
        description: "Options fetched from an endpoint that returns 200 only when
          the resolved bearer header is present (PROD-817). A successful resolve
          proves the values_ref_config auth header actually reaches the remote.
          The token is a ${cred:...} reference resolved server-side from Vault."
        key: region_authed
        type: string
        widget: dropdown
        values_ref: http://values-ref-auth/values_ref_auth.json
        values_ref_config:
          auth:
            type: bearer
            token: "${cred:values-ref-token.token}"
        default: "eu-west-1"
