resource_types:
  - name: mock
    type: registry-image
    source:
      repository: concourse/mock-resource

# Each of this resources trigger a dedicated resource job
resources:
  - name: on-create-resource
    type: mock
    check_every: never
    source:
      mirror_self: true
      initial_version: "0"

  - name: on-update-resource
    type: mock
    check_every: never
    source:
      mirror_self: true
      initial_version: "0"

  - name: on-delete-resource
    type: mock
    check_every: never
    source:
      mirror_self: true
      initial_version: "0"

jobs:
  - name: simple-job
    plan:
      - task: run
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          run:
            path: echo
            args: ["hello"]

  # Triggered directly by the backend hook
  - name: on-pipeline-created
    plan:
      - task: notify
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          params:
            NOTIFY_URL: ((notify_url))
          run:
            path: sh
            args:
              - -exc
              - wget -q "$NOTIFY_URL/created-job" && echo "on-pipeline-created done"

  # Triggered by on-create-resource being checked
  - name: on-pipeline-created-by-resource
    plan:
      - get: on-create-resource
        trigger: true
      - task: notify
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          params:
            NOTIFY_URL: ((notify_url))
          run:
            path: sh
            args:
              - -exc
              - wget -q "$NOTIFY_URL/created-resource" && echo "on-pipeline-created-by-resource done"

  - name: on-pipeline-updated
    plan:
      - task: notify
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          params:
            NOTIFY_URL: ((notify_url))
          run:
            path: sh
            args:
              - -exc
              - wget -q "$NOTIFY_URL/updated-job" && echo "on-pipeline-updated done"

  - name: on-pipeline-updated-by-resource
    plan:
      - get: on-update-resource
        trigger: true
      - task: notify
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          params:
            NOTIFY_URL: ((notify_url))
          run:
            path: sh
            args:
              - -exc
              - wget -q "$NOTIFY_URL/updated-resource" && echo "on-pipeline-updated-by-resource done"

  - name: on-pipeline-deleted
    plan:
      - task: notify
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          params:
            NOTIFY_URL: ((notify_url))
          run:
            path: sh
            args:
              - -exc
              - wget -q "$NOTIFY_URL/deleted-job" && echo "on-pipeline-deleted done"

  - name: on-pipeline-deleted-by-resource
    plan:
      - get: on-delete-resource
        trigger: true
      - task: notify
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          params:
            NOTIFY_URL: ((notify_url))
          run:
            path: sh
            args:
              - -exc
              - wget -q "$NOTIFY_URL/deleted-resource" && echo "on-pipeline-deleted-by-resource done"
