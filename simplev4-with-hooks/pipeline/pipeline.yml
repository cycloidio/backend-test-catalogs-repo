resource_types:
  - name: mock
    type: registry-image
    source:
      repository: concourse/mock-resource

resources:
  - name: on-create-resource
    type: mock
    check_every: never
    source:
      mirror_self: true
      initial_version: "0"

  - name: on-update-resource
    type: mock
    check_every: never
    source:
      mirror_self: true
      initial_version: "0"

  - name: on-delete-resource
    type: mock
    check_every: never
    source:
      mirror_self: true
      initial_version: "0"

jobs:
  - name: simple-job
    plan:
      - task: run
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          run:
            path: echo
            args: ["hello"]

  - name: on-pipeline-created
    plan:
      - get: on-create-resource
        trigger: true
      - task: notify
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          params:
            NOTIFY_URL: ((notify_url))
          run:
            path: sh
            args:
              - -exc
              - wget -q "$NOTIFY_URL/created" && echo "on-pipeline-created done"

  - name: on-pipeline-updated
    plan:
      - get: on-update-resource
        trigger: true
      - task: notify
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          params:
            NOTIFY_URL: ((notify_url))
          run:
            path: sh
            args:
              - -exc
              - wget -q "$NOTIFY_URL/updated" && echo "on-pipeline-updated done"

  - name: on-pipeline-deleted
    plan:
      - get: on-delete-resource
        trigger: true
      - task: notify
        config:
          platform: linux
          image_resource:
            type: registry-image
            source: { repository: alpine }
          params:
            NOTIFY_URL: ((notify_url))
          run:
            path: sh
            args:
              - -exc
              - wget -q "$NOTIFY_URL/deleted" && echo "on-pipeline-deleted done"
