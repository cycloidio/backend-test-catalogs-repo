# Exercises the stackforms values `transform` pipeline (PROD-652).
# See: https://docs.staging.cycloid.io/deploy/stackforms/file-format.html
use_cases:
- name: default
  sections:
  - name: Transform
    groups:
    - name: Options
      technologies: [pipeline]
      vars:
      - name: "Message"
        description: "A message echoed during pipeline runs."
        key: message
        type: string
        widget: simple_text
        default: "hello world"
      - name: "Region"
        description: "Dropdown whose static values pass through a cast:string step
          (PROD-806). A no-op here since they are already strings, but it exercises
          cast on static (non value_ref) values."
        key: region
        type: string
        widget: dropdown
        values: ["eu-west-1", "eu-west-3", "us-east-1"]
        default: "eu-west-1"
        transform:
        - cast: string
      - name: "Region (from value_ref)"
        description: "Options fetched from a value_ref API that returns a
          {\"data\": [...]} shape (rejected by the strict decode), reshaped into
          a flat list by an extract transform (PROD-807). No static values, so
          the options come solely from the fetched+extracted response."
        key: region_from_ref
        type: string
        widget: dropdown
        values_ref: http://minio:9000/valuesref/values_ref_extract.json
        transform:
        - extract: .data
      - name: "Region (mapped from value_ref)"
        description: "value_ref returns [{region: ...}] objects; extract flattens
          them and map projects each into a {label, value} pair (PROD-809). Mapped
          dropdown, label == value so submission is unambiguous."
        key: region_mapped
        type: map
        widget: dropdown
        values_ref: http://minio:9000/valuesref/values_ref_map.json
        transform:
        - extract: .data
        - map: {label: .region, value: .region}
      - name: "Region (deep extract)"
        description: "Deep, iterated extract from a nested {data:{regions:[...]}}
          response into a flat list of codes (PROD-807)."
        key: region_deep
        type: string
        widget: dropdown
        values_ref: http://minio:9000/valuesref/values_ref_nested.json
        transform:
        - extract: ".data.regions[].code"
      - name: "Region (composite label)"
        description: "Nested extract, then a composite label built with jq string
          interpolation (PROD-809). Mapped dropdown; label differs from value."
        key: region_composite
        type: map
        widget: dropdown
        values_ref: http://minio:9000/valuesref/values_ref_nested.json
        transform:
        - extract: .data.regions
        - map:
            label: '"\(.name) (\(.code))"'
            value: .code
      - name: "Region (nested field map)"
        description: "Map projects nested fields of each element into label/value
          (PROD-809). Mapped dropdown; label differs from value."
        key: region_meta
        type: map
        widget: dropdown
        values_ref: http://minio:9000/valuesref/values_ref_meta.json
        transform:
        - map:
            label: .meta.display
            value: .meta.code
      - name: "Tomcat version (cast to string)"
        description: "value_ref returns version numbers; cast coerces them to
          strings so the string-typed widget accepts them (PROD-806)."
        key: tomcat_version
        type: string
        widget: dropdown
        values_ref: http://minio:9000/valuesref/values_ref_versions.json
        transform:
        - cast: string
      - name: "Java major (cast to integer)"
        description: "The same numeric value_ref cast to integers for an
          integer-typed widget, the other direction of string <-> integer
          (PROD-806)."
        key: java_major
        type: integer
        widget: dropdown
        values_ref: http://minio:9000/valuesref/values_ref_versions.json
        transform:
        - cast: integer
      - name: "Memory MB (math multiply)"
        description: "value_ref returns memory in GB; math multiplies by 1024 to
          MB for an integer-typed widget (PROD-808)."
        key: memory_mb
        type: integer
        widget: dropdown
        values_ref: http://minio:9000/valuesref/values_ref_versions.json
        transform:
        - math:
            op: multiply
            by: 1024
